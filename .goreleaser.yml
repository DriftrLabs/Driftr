version: 2

builds:
  - main: ./cmd/driftr/
    binary: driftr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/DriftrLabs/driftr/internal/cli.Version={{.Version}}
      - -X github.com/DriftrLabs/driftr/internal/cli.Commit={{.ShortCommit}}
      - -X github.com/DriftrLabs/driftr/internal/cli.Date={{.Date}}

archives:
  - format: tar.gz
    name_template: >-
      driftr_{{ .Version }}_{{ .Os }}_{{ .Arch }}

brews:
  - name: driftr
    repository:
      owner: DriftrLabs
      name: homebrew-driftr
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/DriftrLabs/driftr"
    description: "Fast JavaScript toolchain versioning without the friction"
    license: "MIT"
    skip_upload: auto
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore: update driftr formula to {{ .Tag }}"
    install: |
      bin.install "driftr"
    caveats: |
      Run setup to create shims and data directories:
        driftr setup

      Add ~/.driftr/bin to the FRONT of your PATH (before Homebrew):
        echo 'export PATH="$HOME/.driftr/bin:$PATH"' >> ~/.zshenv
        echo 'export PATH="$HOME/.driftr/bin:$PATH"' >> ~/.zprofile

      Or run `driftr doctor --fix` to configure PATH automatically.
    test: |
      assert_match version.to_s, shell_output("#{bin}/driftr --version")

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  prerelease: auto
